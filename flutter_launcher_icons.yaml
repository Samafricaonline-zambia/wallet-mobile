flutter_launcher_icons:
  image_path: "assets/app-icon.png"

  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#FF0000"
  adaptive_icon_foreground: "assets/app-icon.png"
  adaptive_icon_foreground_inset: 10

  ios: true
  image_path_ios: "assets/appstore.png"
  remove_alpha_ios: true

  # Optional: Dark mode and tinted variants for iOS
  # image_path_ios_dark_transparent: "assets/appstore-dark.png"
  # image_path_ios_tinted_grayscale: "assets/appstore-tinted.png"
  # desaturate_tinted_to_grayscale_ios: true

  web:
    generate: true
    image_path: "assets/app-icon.png"
    background_color: "#ffffff"
    theme_color: "#6200ee"

  windows:
    generate: true
    image_path: "assets/app-icon.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/app-icon.png"
